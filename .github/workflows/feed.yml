name: weather-feed
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: metno-${{ github.run_id }}
          restore-keys: metno-
      - name: Random wait
        run: sleep $((RANDOM % 20))
      - name: Build
        env:
          FEED_UA: ${{ vars.FEED_UA }}
        run: python build.py
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ vars.PAGES_REPO }}
          publish_branch: main
          publish_dir: ./out
          destination_dir: feed
          keep_files: true
          commit_message: "feed update"
