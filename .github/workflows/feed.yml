name: weather-feed
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: metno-${{ github.run_id }}
          restore-keys: metno-
      - name: Random wait
        run: sleep $((RANDOM % 20))
      - name: Build
        env:
          FEED_UA: ${{ vars.FEED_UA }}
        run: python build.py
      - name: Publish
        run: |
          mkdir -p feed
          cp out/weather.txt out/index.html feed/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          git diff --cached --quiet && exit 0
          git commit -m "feed update"
          git pull --rebase
          git push
